# apOS container edition — one command to run the whole app.
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Ollama runs on the HOST (native Metal GPU) — the containers reach it at
# host.docker.internal:11434. Postgres, the web app, and the worker are here.
# Local-first: no cloud account needed.
name: aios

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  environment:
    DATABASE_URL: postgres://aios:aios@postgres:5432/aios
    OLLAMA_BASE_URL: http://host.docker.internal:11434
    # MLX is a host opt-in; point at the host if you enable it.
    MLX_BASE_URL: http://host.docker.internal:1234/v1
    # Ask web-search uses the bundled SearXNG below (zero-config). The
    # `searxng_url` setting in Settings · Connections overrides this if set.
    SEARXNG_URL: http://searxng:8080
    # Low-spec "cloud-brain": when install.sh detects a machine that can't run a
    # local chat model it sets these (in .env) so reasoning routes to OpenRouter's
    # free tier while embeddings stay local. Empty by default → fully local-first.
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    AIOS_DEFAULT_BRAIN: ${AIOS_DEFAULT_BRAIN:-}
    AIOS_DEFAULT_MODEL: ${AIOS_DEFAULT_MODEL:-}
    # Nightly pg_dump backups (worker) — on a volume, not the container's
    # throwaway home. Bind a host folder here instead for offsite sync.
    AIOS_BACKUP_DIR: /backups
  volumes:
    - app_backups:/backups
  extra_hosts:
    # Lets the container reach host Ollama on Linux/Colima (Docker Desktop /
    # OrbStack provide host.docker.internal automatically; this is harmless there).
    - "host.docker.internal:host-gateway"
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: aios
      POSTGRES_PASSWORD: aios
      POSTGRES_DB: aios
    volumes:
      - app_pgdata:/var/lib/postgresql/data
      # Creates the pgvector extension on first init (migrations need it).
      - ./init-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aios -d aios"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot: apply migrations, then exit. Web/worker wait for this to succeed.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgres://aios:aios@postgres:5432/aios
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    command: ["pnpm", "start"]
    ports:
      - "${AIOS_WEB_PORT:-3777}:3777"

  worker:
    <<: *app
    command: ["pnpm", "worker"]

  # Bundled web-search backend for Ask (keyless, self-hosted). JSON API enabled
  # in searxng/settings.yml. Not published to the host — only the app reaches it.
  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
    restart: unless-stopped

volumes:
  app_pgdata:
  app_backups:
